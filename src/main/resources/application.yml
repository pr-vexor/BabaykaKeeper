spring:
  datasource:
    url: jdbc:postgresql://localhost:54321/babaykakeeper
    username: babayka_user
    password: babayka_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    pr.unikitty.telegrambot.babaykakeeper: DEBUG
    org.hibernate.SQL: DEBUG
    
app:
  instance:
    name: ${INSTANCE_NAME:home-pc}
    
telegram:
  bot:
    token: ${BOT_TOKEN}
    name: ${BOT_NAME}
  owner-id: ${OWNER_ID}
  channel-id: ${CHANNEL_ID}
  friends-group-id: ${FRIENDS_GROUP_ID}